<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>学習タイマー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f6f2">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    /* 既定＝セット中（白） */
    --bg:#f7f6f2;
    --bg2:#ffffff;
    --ink:#14211f;
    --dim:#8d938c;
    --line:rgba(20,33,31,.14);
    --accent:#b07a2a;
    --btn-bg:rgba(20,33,31,.04);
    --main-bg:#14211f;
    --main-ink:#f7f6f2;

    background:radial-gradient(120% 90% at 50% -10%, var(--bg2) 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,system-ui,sans-serif;
    display:flex;flex-direction:column;
    padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
    overflow:hidden;user-select:none;-webkit-user-select:none;
    transition:background .5s ease,color .5s ease;
  }
  /* 稼働中＝黒 */
  body.run{
    --bg:#0b110f;
    --bg2:#18251f;
    --ink:#eef3ea;
    --dim:#7d8c84;
    --line:rgba(238,243,234,.16);
    --accent:#e0b062;
    --btn-bg:rgba(238,243,234,.05);
    --main-bg:#e0b062;
    --main-ink:#241a08;
  }
  /* 終了＝いちばん明るい */
  body.done{
    --bg:#fff6d8;
    --bg2:#ffffff;
    --ink:#2a1c00;
    --dim:#8a7440;
    --line:rgba(42,28,0,.18);
    --accent:#c8891a;
    --btn-bg:rgba(42,28,0,.05);
    --main-bg:#f0b429;
    --main-ink:#2a1c00;
    animation:flare 1.1s ease-out 3;
  }
  @keyframes flare{
    0%{filter:brightness(1.45)}
    40%{filter:brightness(1)}
    70%{filter:brightness(1.28)}
    100%{filter:brightness(1)}
  }

  header{display:flex;align-items:baseline;gap:14px;flex:0 0 auto;min-height:20px}
  .mark{font-family:"DM Mono",monospace;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
  .state{margin-left:auto;font-family:"DM Mono",monospace;font-size:13px;letter-spacing:.2em;color:var(--accent)}

  main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
  .dial{position:relative;width:min(42vh,70vw);aspect-ratio:1}
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--line);stroke-width:6}
  .arc{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}
  .readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .time{
    font-family:"DM Mono",monospace;font-weight:300;
    font-size:min(14vh,21vw);line-height:.9;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  }
  .sub{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.3em;color:var(--dim)}

  /* 履歴 */
  .history{flex:0 0 auto;display:flex;gap:12px;align-items:center;margin:0 0 12px;min-height:48px}
  .history .label{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.22em;color:var(--dim);flex:0 0 auto}
  .history .chips{
    display:flex;gap:10px;flex:1 1 auto;min-width:0;
    overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;
    padding:4px 2px;
    /* 端をフェードさせて続きがあることを示す */
    mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 22px),transparent 100%);
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 22px),transparent 100%);
  }
  .history .chips::-webkit-scrollbar{display:none}
  .history button{
    appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--btn-bg);
    color:var(--ink);padding:11px 20px;font-family:"DM Mono",monospace;font-size:16px;
    font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap;scroll-snap-align:start;
    transition:transform .08s,background .15s;
  }
  .history button:active{transform:scale(.95)}
  .history .empty{font-size:13px;color:var(--dim);letter-spacing:.06em}

  .adders{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 12px}
  .adders button{
    appearance:none;border:1px solid var(--line);border-radius:16px;background:var(--btn-bg);
    color:var(--ink);padding:16px 6px;font-family:"DM Mono",monospace;font-size:clamp(17px,2.5vh,24px);
    transition:transform .08s,background .15s;
  }
  .adders button:active{transform:scale(.95)}
  .adders button small{display:block;font-size:11px;letter-spacing:.2em;color:var(--dim);margin-top:4px}

  .controls{flex:0 0 auto;display:grid;grid-template-columns:1fr 2.4fr;gap:12px}
  .controls button{
    appearance:none;border:none;border-radius:20px;font-weight:700;letter-spacing:.14em;
    font-family:"Zen Kaku Gothic New",sans-serif;transition:transform .08s,background .3s,color .3s;
  }
  .controls button:active{transform:scale(.98)}
  #reset{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:clamp(15px,2.1vh,20px);padding:21px 0}
  #toggle{background:var(--main-bg);color:var(--main-ink);font-size:clamp(20px,3vh,30px);padding:21px 0}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <span class="mark">学習タイマー</span>
  <span class="state" id="state"></span>
</header>

<main>
  <div class="dial">
    <svg viewBox="0 0 200 200">
      <circle class="track" cx="100" cy="100" r="92"></circle>
      <circle class="arc" id="arc" cx="100" cy="100" r="92" stroke-dasharray="578.05" stroke-dashoffset="578.05"></circle>
    </svg>
    <div class="readout">
      <div class="time" id="time">00:00</div>
      <div class="sub" id="sub">時間を足してください</div>
    </div>
  </div>
</main>

<div class="history">
  <span class="label">履歴</span>
  <div class="chips" id="chips"><span class="empty">スタートすると残ります</span></div>
</div>

<div class="adders">
  <button data-add="600">10<small>分</small></button>
  <button data-add="300">5<small>分</small></button>
  <button data-add="60">1<small>分</small></button>
  <button data-add="30">30<small>秒</small></button>
  <button data-add="10">10<small>秒</small></button>
</div>

<div class="controls">
  <button id="reset">リセット</button>
  <button id="toggle">スタート</button>
</div>

<script>
const CIRC = 2 * Math.PI * 92;
let total = 0, remain = 0, running = false, done = false;
let last = 0, raf = null, ctx = null;
let history = [];   // 直近20件（新しい順）
const STORE_KEY = 'study-timer:history:v1';
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  if (Array.isArray(saved)) history = saved.filter(v=>Number.isFinite(v) && v>0).slice(0,20);
} catch(e){ /* 壊れていたら空で始める */ }

const $time = document.getElementById('time');
const $sub = document.getElementById('sub');
const $arc = document.getElementById('arc');
const $toggle = document.getElementById('toggle');
const $state = document.getElementById('state');
const $chips = document.getElementById('chips');

function fmt(s){
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  const mm = String(m).padStart(2,'0'), ss = String(sec).padStart(2,'0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function render(){
  document.body.classList.toggle('run', running);
  document.body.classList.toggle('done', done);
  $time.textContent = fmt(remain);
  const ratio = total > 0 ? Math.max(0, remain/total) : 0;
  $arc.style.strokeDashoffset = CIRC * (1 - ratio);
  $toggle.textContent = running ? 'ストップ' : 'スタート';
  $state.textContent = running ? '計測中' : (done ? '終了' : '');
  $sub.textContent = done ? 'おつかれさま'
    : total === 0 ? '時間を足してください'
    : running ? '集中' : '一時停止中';
}

function renderHistory(){
  if (!history.length){
    $chips.innerHTML = '<span class="empty">スタートすると残ります</span>';
    return;
  }
  $chips.innerHTML = '';
  history.forEach(sec=>{
    const b = document.createElement('button');
    b.textContent = fmt(sec);
    b.addEventListener('click', ()=>{
      audio(); stop(); done = false;
      total = sec; remain = sec; render();
    });
    $chips.appendChild(b);
  });
}

function pushHistory(sec){
  history = [sec, ...history.filter(v=>v !== sec)].slice(0,20);
  try { localStorage.setItem(STORE_KEY, JSON.stringify(history)); } catch(e){}
  renderHistory();
  $chips.scrollTo({left:0, behavior:'smooth'});
}

/* ---- 音（チーン）---- */
function audio(){
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function bell(){
  const ac = audio(), t = ac.currentTime;
  const out = ac.createGain();
  out.gain.value = 0.9; out.connect(ac.destination);
  [[880,1],[1320,.55],[2640,.3],[3960,.14]].forEach(([f,g],i)=>{
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type='sine'; o.frequency.value=f;
    gn.gain.setValueAtTime(0,t);
    gn.gain.linearRampToValueAtTime(g*0.6, t+0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + 3.4 - i*0.5);
    o.connect(gn); gn.connect(out);
    o.start(t); o.stop(t+3.6);
  });
}

/* ---- 計測中は画面を消さない ---- */
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    } else if (!on && wakeLock){
      await wakeLock.release(); wakeLock = null;
    }
  } catch(e){ /* 非対応環境では何もしない */ }
}

/* ---- ループ ---- */
function tick(now){
  if (!running) return;
  remain -= (now - last)/1000; last = now;
  if (remain <= 0){
    remain = 0; running = false; done = true;
    keepAwake(false);
    bell();
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    render();
    // 終了表示のあと、同じ時間をセットし直してすぐ再開できるようにする
    const repeat = total;
    setTimeout(()=>{
      if (!running && done && remain === 0 && total === repeat){
        remain = repeat; render();
      }
    }, 1400);
    return;
  }
  render();
  raf = requestAnimationFrame(tick);
}
function start(){
  if (remain <= 0) return;
  pushHistory(total);
  done = false; running = true; last = performance.now();
  audio(); keepAwake(true);
  raf = requestAnimationFrame(tick);
  render();
}
function stop(){
  running = false;
  if (raf) cancelAnimationFrame(raf);
  keepAwake(false);
  render();
}

/* ---- 操作 ---- */
document.querySelectorAll('[data-add]').forEach(b=>{
  b.addEventListener('click', ()=>{
    audio();
    done = false;
    const add = +b.dataset.add;
    remain += add; total += add;
    render();
  });
});
document.getElementById('reset').addEventListener('click', ()=>{
  stop(); done = false; total = 0; remain = 0; render();
});
$toggle.addEventListener('click', ()=> running ? stop() : start());

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){ last = performance.now(); if (running) keepAwake(true); }
});
document.addEventListener('dblclick', e=>e.preventDefault());

renderHistory(); render();

/* ---- オフライン対応 ---- */
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
